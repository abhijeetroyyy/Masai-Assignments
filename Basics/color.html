<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Background Color</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ff0000; /* Default background color */
        }

        @media (min-width: 600px) {
            body {
                background-color: #00ff00; /* Background color for widths 600px and above */
            }
        }

        @media (min-width: 900px) {
            body {
                background-color: #0000ff; /* Background color for widths 900px and above */
            }
        }

        @media (min-width: 1200px) {
            body {
                background-color: #ffff00; /* Background color for widths 1200px and above */
            }
        }
    </style>
</head>
<body>
    
</body>
</html>
